name: active-inference-power-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --extra dev python -m compileall -q src scripts tests examples
      - run: uv run --extra dev ruff check src scripts tests examples
      - run: uv run --extra dev mypy src scripts tests examples --ignore-missing-imports
      - run: uv run --extra dev python -m pytest tests/ --cov=active_inference_power --cov-branch --cov-fail-under=95 -q
      - run: uv build --out-dir /tmp/active-inference-power-wheel
      - run: uv run python -c "import active_inference_power; print(active_inference_power.__name__)"
      - run: uv venv /tmp/active-inference-power-clean-venv
      - run: uv pip install --python /tmp/active-inference-power-clean-venv/bin/python /tmp/active-inference-power-wheel/*.whl
      - run: /tmp/active-inference-power-clean-venv/bin/python -c "import active_inference_power; print(active_inference_power.PowerScenario.__name__)"

  gnn-conformance:
    timeout-minutes: 120
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - name: Check out the pinned GNN release
        run: |
          set -euo pipefail
          PIN=models/gnn-pin.json
          PY=$(uv python find --no-project 3.14)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          TAG=$("$PY" -c "import json;print(json.load(open('$PIN'))['tag'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          # The checkout follows models/gnn-pin.json; a pin bump re-points it.
          git clone --depth 1 --branch "$TAG" "$REPO" ../Generalized_Notation_Notation
          test "$(git -C ../Generalized_Notation_Notation rev-parse HEAD)" = "$COMMIT"
          # The parser package imports its dependency surface; give the
          # checkout-local interpreter the pinned package and its dependencies.
          uv venv --python 3.14 ../Generalized_Notation_Notation/.venv
          uv pip install --python ../Generalized_Notation_Notation/.venv/bin/python \
            ../Generalized_Notation_Notation
      - name: Validate the GNN specifications against the pinned parser
        env:
          ACTIVE_INFERENCE_POWER_GNN_ROOT: ${{ github.workspace }}/../Generalized_Notation_Notation
        run: |
          uv run --extra dev python scripts/validate_gnn_specs.py
          uv run --extra dev pytest tests/test_gnn_specs.py -q

      - name: Report the resolved GNN version
        run: |
          PIN=models/gnn-pin.json
          VERSION=$(python3 -c "import json;print(json.load(open('$PIN'))['version'].removeprefix('v'))")
          test -n "$VERSION"
          TAG=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'])")
          test "$VERSION" = "${TAG#v}"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
  fast-artifacts:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/generate_results.py --profile fast --workers 2 --checkpoint-every 500
      - run: uv run python scripts/generate_quality_report.py
      - run: uv run python scripts/z_generate_manuscript_variables.py
      - run: uv run python scripts/audit_documentation_links.py
      - run: uv run python scripts/audit_manuscript_presentation.py --resolved-manuscript-dir output/manuscript
      - run: uv run python scripts/audit_figure_accessibility.py --output-root output
      # A clean CI checkout has no sibling template renderer. This checks the
      # source-bound fast bundle without mislabeling it as a release review.
      - run: uv run python scripts/audit_fast_bundle.py --output-root output
      - run: uv run python examples/01_reference_power.py --profile fast --output-root output/examples-ci
      - run: uv run python examples/02_environment_control.py --profile fast --output-root output/examples-ci
      - run: uv run python examples/03_adaptive_target_selection.py --profile fast --output-root output/examples-ci
      - run: test "$(uv run python -c 'import json; print(json.load(open("output/manifest.json"))["complete"])')" = "False"
      - run: test -z "$(rg '\{\{' output/manuscript || true)"
