name: active-inference-power-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - name: Check lock and static gates once in the shared 3.14 environment
        if: matrix.python-version == '3.14'
        run: |
          uv lock --check
          ./run.sh lint types docs package
      # The 3.14 lane produces the fast bundle before the quality gate, then
      # reuses that gate's quality.json. No second full pytest invocation.
      - name: Produce fast bundle
        if: matrix.python-version == '3.14'
        run: .venv/bin/python scripts/generate_results.py --profile fast --workers 2 --checkpoint-every 500
      - run: ./run.sh test-full
      - name: Hydrate and audit the fast bundle (not a release render)
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          .venv/bin/python scripts/z_generate_manuscript_variables.py
          .venv/bin/python scripts/audit_manuscript_presentation.py --resolved-manuscript-dir output/manuscript
          .venv/bin/python scripts/audit_figure_accessibility.py --output-root output
          .venv/bin/python scripts/audit_fast_bundle.py --output-root output
          .venv/bin/python examples/01_reference_power.py --profile fast --output-root output/examples-ci
          .venv/bin/python examples/02_environment_control.py --profile fast --output-root output/examples-ci
          .venv/bin/python examples/03_adaptive_target_selection.py --profile fast --output-root output/examples-ci
          .venv/bin/python -c 'import json; assert json.load(open("output/manifest.json"))["complete"] is False'
          .venv/bin/python -c 'from pathlib import Path; assert not any("{{" in p.read_text() for p in Path("output/manuscript").glob("*.md"))'

  gnn-conformance:
    timeout-minutes: 120
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - name: Check out the pinned GNN release
        run: |
          set -euo pipefail
          PIN=models/gnn-pin.json
          PY=$(uv python find --no-project 3.14)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          TAG=$("$PY" -c "import json;print(json.load(open('$PIN'))['tag'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          # The checkout follows models/gnn-pin.json; a pin bump re-points it.
          git clone --depth 1 --branch "$TAG" "$REPO" ../Generalized_Notation_Notation
          test "$(git -C ../Generalized_Notation_Notation rev-parse HEAD)" = "$COMMIT"
          # The parser package imports its dependency surface; give the
          # checkout-local interpreter the pinned package and its dependencies.
          uv venv --python 3.14 ../Generalized_Notation_Notation/.venv
          uv pip install --python ../Generalized_Notation_Notation/.venv/bin/python \
            ../Generalized_Notation_Notation
      - name: Validate the GNN specifications against the pinned parser
        env:
          ACTIVE_INFERENCE_POWER_GNN_ROOT: ${{ github.workspace }}/../Generalized_Notation_Notation
        run: ./run.sh gnn

      - name: Report the resolved GNN version
        run: |
          PIN=models/gnn-pin.json
          VERSION=$(python3 -c "import json;print(json.load(open('$PIN'))['version'].removeprefix('v'))")
          test -n "$VERSION"
          TAG=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'])")
          test "$VERSION" = "${TAG#v}"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
